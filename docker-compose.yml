services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yadette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yadette}
      POSTGRES_DB: ${POSTGRES_DB:-yadette}
    ports:
      - '5432:5432'
    volumes:
      - yadette-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yadette} -d ${POSTGRES_DB:-yadette}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yadette}:${POSTGRES_PASSWORD:-yadette}@db:5432/${POSTGRES_DB:-yadette}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  bot:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yadette}:${POSTGRES_PASSWORD:-yadette}@db:5432/${POSTGRES_DB:-yadette}?schema=public
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Tehran}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fa}
      REMINDER_CHECK_INTERVAL_MS: ${REMINDER_CHECK_INTERVAL_MS:-60000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Feature flags are read from the environment, and an env var only reaches
      # the container if it is listed here. Without these lines a
      # `SEARCH_ENABLED=false` in .env would silently have no effect in Docker.
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
      CALENDAR_ENABLED: ${CALENDAR_ENABLED:-true}
      SNOOZE_ENABLED: ${SNOOZE_ENABLED:-true}
      HEALTHCHECK_ENABLED: ${HEALTHCHECK_ENABLED:-true}
      GIFTS_ENABLED: ${GIFTS_ENABLED:-false}
      GROUPS_ENABLED: ${GROUPS_ENABLED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  yadette-db:
